title: "ZEROxYakuza"
tagline: "Pentester - Red Team"
description: "Notas técnicas sobre research y aprendizaje de seguridad ofensiva."
url: "https://zeroxyakuza.github.io"
baseurl: ""
lang: en
timezone: Europe/Madrid

author:
  name: "David Fernández"
  email: ""
  bio: "Red Team Operator"

github_username: "zeroxyakuza"
twitter_username: ""
linkedin_username: ""

avatar: "/assets/img/avatar.jpg"

markdown: kramdown
highlighter: rouge
permalink: /posts/:title/

collections:
  research:
    output: true
    permalink: /research/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: research
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
