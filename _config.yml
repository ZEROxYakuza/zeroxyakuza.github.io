title: "ZEROxYakuza"
tagline: "Vulnerability Research · Exploit Development"
description: "Technical notes and research on vulnerability research, reverse engineering and exploit development."
url: "https://zeroxyakuza.github.io"
baseurl: ""
lang: en
timezone: Europe/Madrid

author:
  name: "David Fernández"
  email: ""
  bio: "Vulnerability Researcher & Red Team Operator"

